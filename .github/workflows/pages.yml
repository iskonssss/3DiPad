name: Deploy kiosk to GitHub Pages

# Publishes the self-contained kiosk (public/standalone.html) as the site root,
# so it's live at https://<you>.github.io/<repo>/ — draw, preview, download g-code,
# all client-side, no server needed.

on:
  push:
    branches: [main]
    paths:
      - public/standalone.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp public/standalone.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
