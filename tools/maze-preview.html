<title>Name Maze Tray</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400;100,600;100,800&display=swap">
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --ink: #171b22; --muted: #5d6675; --line: #d6dbe3;
    --tray: #3b8fd9; --accent: #e9b929; --btn: #171b22; --btn-ink: #ffffff;
    --font: "Archivo", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #12151a; --panel: #1b2027; --ink: #eef1f5; --muted: #98a2b1; --line: #2c333d; --btn: #eef1f5; --btn-ink: #12151a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #12151a; --panel: #1b2027; --ink: #eef1f5; --muted: #98a2b1; --line: #2c333d; --btn: #eef1f5; --btn-ink: #12151a;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; }
  .app { display: grid; grid-template-columns: 1fr 300px; height: 100%; }
  .view { position: relative; min-width: 0; min-height: 320px; }
  canvas.gl { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  .stats { position: absolute; left: 16px; top: 16px; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
  .stat b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .stat span { font-size: 16px; font-weight: 600; }
  .rail { background: var(--panel); border-left: 1px solid var(--line); padding: 20px 16px; padding-block: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
  .sub { color: var(--muted); margin: 4px 0 0; line-height: 1.4; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  input[type=text], select { font: inherit; font-family: var(--font); font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; text-transform: none; letter-spacing: 0; }
  input[type=text]:focus, select:focus, button:focus-visible { outline: 2px solid var(--tray); outline-offset: 1px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; background: transparent; color: var(--ink); border: 0; border-radius: 0; padding: 9px 6px; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
  .toggles { display: flex; flex-direction: column; gap: 8px; }
  .toggle { display: flex; flex-direction: row; align-items: center; gap: 10px; font-size: 14px; color: var(--ink); text-transform: none; letter-spacing: 0; font-weight: 500; cursor: pointer; }
  .toggle input { width: 18px; height: 18px; margin: 0; accent-color: var(--tray); }
  button { font: inherit; font-family: var(--font); font-weight: 700; font-size: 14px; padding: 10px 14px; border-radius: 8px; border: 0; background: var(--btn); color: var(--btn-ink); cursor: pointer; }
  button.quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .colours { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
  .sw[aria-pressed="true"] { border-color: var(--ink); }
  .note { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0; }
  .warn { font-size: 12px; color: #b5471b; line-height: 1.5; margin: 0; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: minmax(340px, 55vh) auto; height: auto; min-height: 100%; }
    .rail { border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <div class="view">
    <canvas id="c" class="gl" tabindex="0" aria-label="3D view of the maze tray. Drag to rotate, pinch or scroll to zoom."></canvas>
    <div class="stats" id="stats"></div>
  </div>
  <aside class="rail">
    <div>
      <h1>Name Maze Tray</h1>
      <p class="sub">Drag to turn it, pinch or scroll to zoom. Times are the layout's rough estimate, not a sliced file.</p>
    </div>
    <label>Version
      <div class="seg" id="modeSeg">
        <button type="button" data-mode="name">Name in the walls</button>
        <button type="button" data-mode="square">Square with initial</button>
      </div>
    </label>

    <div id="nameCtl" class="toggles" style="gap:16px">
      <label>Name
        <input type="text" id="name" maxlength="10" autocomplete="off" spellcheck="false">
      </label>
      <label>Tray
        <div class="seg" id="sizeSeg">
          <button type="button" data-size="80,40">80 × 40</button>
          <button type="button" data-size="100,50">100 × 50</button>
          <button type="button" data-size="120,60">120 × 60</button>
        </div>
      </label>
      <label>Ball
        <div class="seg" id="ballSeg">
          <button type="button" data-ball="3">3 mm</button>
          <button type="button" data-ball="4">4 mm</button>
          <button type="button" data-ball="5">5 mm</button>
        </div>
      </label>
      <label class="toggle"><input type="checkbox" id="hollow"> Hollow letters, maze runs through them</label>
      <button id="shuffle" type="button">Shuffle the maze</button>
    </div>

    <div id="squareCtl" class="toggles" style="gap:16px" hidden>
      <label>Letter
        <input type="text" id="letter" maxlength="3" autocomplete="off" spellcheck="false">
      </label>
      <div class="row">
        <button id="prev" class="quiet" type="button">Previous maze</button>
        <button id="next" type="button">Next maze</button>
      </div>
    </div>

    <label>Font
      <select id="font">
        <option value="'Arial Black', 'Archivo', sans-serif" data-w="900">Arial Black</option>
        <option value="Impact, 'Archivo', sans-serif" data-w="400">Impact</option>
        <option value="'Archivo', sans-serif" data-w="800">Archivo Bold</option>
        <option value="Georgia, 'Times New Roman', serif" data-w="700">Georgia</option>
        <option value="'Comic Sans MS', 'Chalkboard SE', cursive" data-w="700">Comic Sans</option>
        <option value="'Courier New', monospace" data-w="700">Courier</option>
        <option value="Verdana, sans-serif" data-w="700">Verdana</option>
        <option value="'Trebuchet MS', sans-serif" data-w="700">Trebuchet</option>
      </select>
    </label>
    <label>Hotend flow cap for the estimate
      <select id="flow">
        <option value="12">12 mm³/s (Bambu's PLA default)</option>
        <option value="16">16 mm³/s (0.8 nozzle, to be tested)</option>
        <option value="20">20 mm³/s (0.8 nozzle, optimistic)</option>
        <option value="9">9 mm³/s (PETG)</option>
      </select>
    </label>
    <div class="colours">
      <label>Tray
        <div class="swatches" id="traySw"></div>
      </label>
      <label id="inkLabel">Letter
        <div class="swatches" id="inkSw"></div>
      </label>
    </div>
    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="showLid"> Acrylic lid</label>
      <label class="toggle"><input type="checkbox" id="showBall" checked> Ball at the start</label>
      <label class="toggle"><input type="checkbox" id="showPath"> Show the solution</label>
    </div>
    <div class="row">
      <button id="viewTop" class="quiet" type="button">Top view</button>
      <button id="viewIso" class="quiet" type="button">Angled view</button>
    </div>
    <p class="warn" id="warn" hidden></p>
    <p class="note" id="meta"></p>
  </aside>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const LAYOUTS = /*__LAYOUTS__*/null;
const TRAYS = ['#3b8fd9', '#e8443a', '#f2c230', '#2fbf71', '#f06aa8', '#8e5bd6', '#f4f4f4', '#1f2329'];
const INKS = ['#171b22', '#ffffff', '#e8443a', '#f2c230', '#3b8fd9', '#2fbf71'];

const state = {
  mode: 'name', i: 0, letter: '', name: 'KIARA', size: '100,50', ballD: 4, seed: 1,
  font: null, weight: '900', tray: TRAYS[0], ink: INKS[0], lid: false, ball: true, path: false, flow: 12, hollow: true,
};
try { Object.assign(state, JSON.parse(localStorage.getItem('maze-preview-v2') || '{}')); } catch {}
if (LAYOUTS && LAYOUTS.length) state.i = Math.min(Math.max(0, state.i | 0), LAYOUTS.length - 1);
const fontSel = document.getElementById('font');
if (!state.font) { state.font = fontSel.options[0].value; state.weight = fontSel.options[0].dataset.w; }
if (!state.letter) state.letter = (LAYOUTS && LAYOUTS[0] && LAYOUTS[0].letter) || 'M';
if (!LAYOUTS || !LAYOUTS.length) state.mode = 'name';
function save() { try { localStorage.setItem('maze-preview-v2', JSON.stringify(state)); } catch {} }

// ---- scene -----------------------------------------------------------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 2000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-90, 160, 110);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -120;
sun.shadow.camera.right = sun.shadow.camera.top = 120;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 500;
sun.shadow.bias = -0.0005;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01; ground.receiveShadow = true;
scene.add(ground);
// The tray is built in XY with Z up (mm), then this group turns it so three.js's Y is up.
const world = new THREE.Group();
world.rotation.x = -Math.PI / 2;
scene.add(world);
let tray = null;

// ---- shape helpers ---------------------------------------------------------
function roundedRect(x0, y0, x1, y1, r) {
  const s = new THREE.Shape();
  s.moveTo(x0 + r, y0);
  s.lineTo(x1 - r, y0); s.absarc(x1 - r, y0 + r, r, -Math.PI / 2, 0, false);
  s.lineTo(x1, y1 - r); s.absarc(x1 - r, y1 - r, r, 0, Math.PI / 2, false);
  s.lineTo(x0 + r, y1); s.absarc(x0 + r, y1 - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(x0, y0 + r); s.absarc(x0 + r, y0 + r, r, Math.PI, Math.PI * 1.5, false);
  s.closePath();
  return s;
}
function circlePath(cx, cy, r) { const p = new THREE.Path(); p.absarc(cx, cy, r, 0, Math.PI * 2, true); return p; }
function extrude(shape, depth, z, mat, shadow = true) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 24 });
  const m = new THREE.Mesh(g, mat);
  m.position.z = z; m.castShadow = shadow; m.receiveShadow = true;
  return m;
}
function box(cx, cy, w, h, z0, height, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, height), mat);
  m.position.set(cx, cy, z0 + height / 2); m.castShadow = true; m.receiveShadow = true;
  return m;
}
function disposeTray() {
  if (!tray) return;
  world.remove(tray);
  tray.traverse((o) => { o.geometry?.dispose?.(); o.material?.map?.dispose?.(); if (o.material && !o.material.__shared) o.material.dispose?.(); });
  tray = null;
}
function trayMaterial() { return new THREE.MeshStandardMaterial({ color: state.tray, roughness: 0.55, metalness: 0 }); }
function addCommon(L, half, mat) {
  // ball, lid: shared by both versions. L: { W, H, cornerR, floor, wallH, holes, startPocket, pocketDepth, ballD, solution }
  if (state.ball) {
    const ball = new THREE.Mesh(new THREE.SphereGeometry(L.ballD / 2, 32, 24), new THREE.MeshStandardMaterial({ color: 0xd9dde3, metalness: 0.9, roughness: 0.25 }));
    ball.position.set(L.startPocket.x, L.startPocket.y, L.floor - L.pocketDepth + L.ballD / 2);
    ball.castShadow = true;
    tray.add(ball);
  }
  if (state.path && L.solution && L.solution.length > 1) {
    const pts = L.solution.map((p) => new THREE.Vector3(p.x, p.y, L.floor + 0.9));
    const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.0);
    tray.add(new THREE.Mesh(new THREE.TubeGeometry(curve, pts.length * 4, 0.5, 8, false), new THREE.MeshStandardMaterial({ color: 0xe9b929, roughness: 0.5 })));
  }
  if (state.lid) {
    const lid = roundedRect(-half.x, -half.y, half.x, half.y, L.cornerR);
    for (const h of L.holes) lid.holes.push(circlePath(h.x, h.y, h.r));
    const acrylic = new THREE.MeshPhysicalMaterial({ color: 0xdff3ff, transparent: true, opacity: 0.28, roughness: 0.05, metalness: 0, transmission: 0.4, thickness: 3, side: THREE.DoubleSide });
    tray.add(extrude(lid, 3, L.floor + L.wallH + 0.1, acrylic, false));
  }
}

// ---- the seeded maze -------------------------------------------------------
function rng(seed) {
  let a = (seed >>> 0) || 0x9e3779b9;
  return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// ---- version 2: the name in the walls --------------------------------------
//
// A rectangle. The name is rendered in the chosen font, and its letters ARE
// walls: they stand at wall height and the maze is generated around them on
// a grid whose pitch is the ball plus a wall. A cell is usable only if the
// ball fits at its centre clear of the letters, and a passage between two
// cells only if the ball can roll centre to centre without touching a letter.
// Cells the maze cannot reach are filled solid. Start is the left edge,
// finish the cell on the right edge that the maze makes hardest to reach.
function buildName() {
  const [W, H] = state.size.split(',').map(Number);
  const ballD = state.ballD;
  const hollow = !!state.hollow;
  const wallT = 1.0, rimT = 2.0, floor = 0.8, cornerR = 4;
  const wallH = Math.max(2.5, ballD - 0.5);
  const clear = 1.5;                      // corridor = ball + this
  const pocketDepth = 0.4;
  const innerW = W - 2 * rimT, innerH = H - 2 * rimT;
  const pitchMin = ballD + clear + wallT;
  const cols = Math.max(4, Math.floor((innerW + wallT) / pitchMin));
  const rows = Math.max(3, Math.floor((innerH + wallT) / pitchMin));
  const corrX = (innerW - (cols - 1) * wallT) / cols, corrY = (innerH - (rows - 1) * wallT) / rows;
  const pitchX = corrX + wallT, pitchY = corrY + wallT;
  const x0 = -innerW / 2, y0 = -innerH / 2;
  const cellC = (c, r) => ({ x: x0 + c * pitchX + corrX / 2, y: y0 + r * pitchY + corrY / 2 });
  const half = { x: W / 2, y: H / 2 };
  const inset = 3.5, bossR = 3.0, holeR = 1.6;
  const holes = [{ x: -half.x + inset, y: -half.y + inset }, { x: half.x - inset, y: -half.y + inset }, { x: half.x - inset, y: half.y - inset }, { x: -half.x + inset, y: half.y - inset }].map((p) => ({ ...p, r: holeR }));

  // The name as ink on a raster over the inner area, 0.2 mm per pixel.
  const res = 0.2;
  const pw = Math.ceil(innerW / res), ph = Math.ceil(innerH / res);
  const cv = document.createElement('canvas'); cv.width = pw; cv.height = ph;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, pw, ph);
  const text = (state.name || '').trim().toUpperCase();
  const bandW = innerW - 2 * pitchX, bandH = innerH - 2 * pitchY;   // a corridor stays free all round the name
  if (text) {
    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let size = bandH / res;
    ctx.font = state.weight + ' ' + size + 'px ' + state.font;
    const m = ctx.measureText(text);
    const gw = Math.max(1, m.width), gh = Math.max(1, (m.actualBoundingBoxAscent || size * 0.7) + (m.actualBoundingBoxDescent || 0));
    size *= Math.min((bandW / res) / gw, (bandH / res) / gh);
    ctx.font = state.weight + ' ' + size + 'px ' + state.font;
    const m2 = ctx.measureText(text);
    const yOff = ((m2.actualBoundingBoxAscent || 0) - (m2.actualBoundingBoxDescent || 0)) / 2;
    ctx.fillText(text, pw / 2, ph / 2 + yOff);
  }
  const img = ctx.getImageData(0, 0, pw, ph).data;
  const inkUp = new Uint8Array(pw * ph);   // row 0 at the bottom, as the tray's y is up
  for (let y = 0; y < ph; y++) for (let x = 0; x < pw; x++) inkUp[y * pw + x] = img[((ph - 1 - y) * pw + x) * 4] < 128 ? 1 : 0;
  const idx = (x, y) => y * pw + x;
  const inR = (x, y) => x >= 0 && y >= 0 && x < pw && y < ph;
  const discOffs = (rPx) => { const o = []; for (let dy = -rPx; dy <= rPx; dy++) for (let dx = -rPx; dx <= rPx; dx++) if (dx * dx + dy * dy <= rPx * rPx) o.push([dx, dy]); return o; };
  const isEdgeOf = (m, x, y) => m[idx(x, y)] && (x === 0 || y === 0 || x === pw - 1 || y === ph - 1 || !m[idx(x - 1, y)] || !m[idx(x + 1, y)] || !m[idx(x, y - 1)] || !m[idx(x, y + 1)]);

  // Hollow letters: only a band one wall thick along each letter's edge
  // stands; the inside is floor the maze can use. Solid letters: all the ink.
  let band = inkUp;
  if (hollow) {
    band = new Uint8Array(pw * ph);
    const offs = discOffs(Math.ceil(wallT / res));
    for (let y = 0; y < ph; y++) for (let x = 0; x < pw; x++) {
      if (!isEdgeOf(inkUp, x, y)) continue;
      for (const [dx, dy] of offs) { const nx = x + dx, ny = y + dy; if (inR(nx, ny) && inkUp[idx(nx, ny)]) band[idx(nx, ny)] = 1; }
    }
  }
  const toPx = (p) => ({ x: (p.x - x0) / res, y: (p.y - y0) / res });
  const sampleAt = (m, p) => { const q = toPx(p); const x = Math.round(q.x), y = Math.round(q.y); return inR(x, y) && m[idx(x, y)]; };

  // The ball's keep-out: anything within ball/2 + a little of a letter wall,
  // and the same around the lid bosses in the corners, which is what let the
  // first version route the finish into a corner the ball cannot enter.
  const keepR = ballD / 2 + 0.4;
  const keepBand = new Uint8Array(pw * ph);
  {
    const offs = discOffs(Math.ceil(keepR / res));
    for (let y = 0; y < ph; y++) for (let x = 0; x < pw; x++) {
      if (!band[idx(x, y)]) continue;
      if (!isEdgeOf(band, x, y)) { keepBand[idx(x, y)] = 1; continue; }
      for (const [dx, dy] of offs) { const nx = x + dx, ny = y + dy; if (inR(nx, ny)) keepBand[idx(nx, ny)] = 1; }
    }
  }
  const keepBoss = new Uint8Array(pw * ph);
  {
    const rPx = Math.ceil((bossR + keepR) / res);
    for (const h of holes) {
      const q = toPx(h);
      for (let dy = -rPx; dy <= rPx; dy++) for (let dx = -rPx; dx <= rPx; dx++) {
        if (dx * dx + dy * dy > rPx * rPx) continue;
        const nx = Math.round(q.x) + dx, ny = Math.round(q.y) + dy;
        if (inR(nx, ny)) keepBoss[idx(nx, ny)] = 1;
      }
    }
  }
  // A passage between two cells: the ball rolls centre to centre. Clear of
  // the bosses always. Clear of the letter walls, or (hollow letters) across
  // one wall band exactly once, in which case that band gets an opening.
  const maxRun = wallT + 2 * keepR + 0.8;
  const passage = (a, b) => {
    const n = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / (res * 2));
    let runs = 0, run = 0, longest = 0;
    for (let i = 0; i <= n; i++) {
      const p = { x: a.x + (b.x - a.x) * i / n, y: a.y + (b.y - a.y) * i / n };
      if (sampleAt(keepBoss, p)) return null;
      if (sampleAt(keepBand, p)) { if (!run) runs++; run++; longest = Math.max(longest, run); }
      else run = 0;
    }
    if (!runs) return { cut: false };
    if (hollow && runs === 1 && longest * res * 2 <= maxRun) return { cut: true };
    return null;
  };

  // Cells and the maze.
  const key = (c, r) => c + ',' + r;
  const usable = new Set();
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const p = cellC(c, r); if (!sampleAt(keepBand, p) && !sampleAt(keepBoss, p)) usable.add(key(c, r)); }
  const wkey = (a, b) => (a.c < b.c || (a.c === b.c && a.r < b.r)) ? a.c + ',' + a.r + '|' + b.c + ',' + b.r : b.c + ',' + b.r + '|' + a.c + ',' + a.r;
  const DIRS = [{ dc: 1, dr: 0 }, { dc: -1, dr: 0 }, { dc: 0, dr: 1 }, { dc: 0, dr: -1 }];
  const inGrid = (n) => n.c >= 0 && n.r >= 0 && n.c < cols && n.r < rows;
  let start = null;

// ---- version 1: the square with the initial in the chamber -----------------
function buildSquare() {
  const L = LAYOUTS[state.i];
  disposeTray();
  tray = new THREE.Group();
  const mat = trayMaterial();
  const half = { x: L.outer / 2, y: L.outer / 2 };
  const floorShape = roundedRect(-half.x, -half.y, half.x, half.y, L.cornerR);
  if (L.lid.throughFloor) for (const h of L.holes) floorShape.holes.push(circlePath(h.x, h.y, h.r));
  floorShape.holes.push(circlePath(L.startPocket.x, L.startPocket.y, L.startPocket.r));
  tray.add(extrude(floorShape, L.floor, 0, mat));
  const dimpleFloor = new THREE.Shape(); dimpleFloor.absarc(L.startPocket.x, L.startPocket.y, L.startPocket.r, 0, Math.PI * 2, false);
  tray.add(extrude(dimpleFloor, Math.max(0.2, L.floor - L.pocketDepth), 0, mat, false));
  const rim = roundedRect(-half.x, -half.y, half.x, half.y, L.cornerR);
  rim.holes.push(roundedRect(-half.x + L.rimT, -half.y + L.rimT, half.x - L.rimT, half.y - L.rimT, Math.max(0.2, L.cornerR - L.rimT)));

    const len = Math.hypot(w.b.x - w.a.x, w.b.y - w.a.y);
    tray.add(box((w.a.x + w.b.x) / 2, (w.a.y + w.b.y) / 2, w.dir === 'v' ? L.wallT : len, w.dir === 'v' ? len : L.wallT, L.floor, L.wallH, mat));
  }
  const lr = L.letterRect;
  const tex = letterTexture(lr.x1 - lr.x0, lr.y1 - lr.y0, state.letter, state.font, state.weight, state.ink);

  const minutes = (L.rough.floorMinutes + L.rough.wallMinutes) * flowScale + (L.rough.minutes - L.rough.floorMinutes - L.rough.wallMinutes);
  stats([['Tray', `${L.outer} mm`], ['Corridor', `${L.corridor.toFixed(1)} mm`], ['Rough print', `~${Math.round(minutes)} min`], ['Plastic', `~${Math.round(L.rough.grams)} g`]]);
  document.getElementById('warn').hidden = true;
  document.getElementById('meta').textContent = `Two colours: the letter is a swap in the chamber floor. Maze ${state.i + 1} of ${LAYOUTS.length}, seed ${L.seed}. ${L.cells}×${L.cells} cells, ${L.chamber}×${L.chamber} chamber, walls ${L.wallT} mm × ${L.wallH} mm high on a ${L.floor} mm floor. Chamber opens on the ${L.finishSide}. Estimate at ${state.flow} mm³/s.`;
}

function letterTexture(w, h, text, font, weight, ink) {
  const px = 24;
  const cv = document.createElement('canvas');
  cv.width = Math.round(w * px); cv.height = Math.round(h * px);

  ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.font = `${weight} ${size}px ${font}`;
  const m2 = ctx.measureText(text || ' ');
  ctx.fillText(text, cv.width / 2, cv.height / 2 + ((m2.actualBoundingBoxAscent || 0) - (m2.actualBoundingBoxDescent || 0)) / 2);

  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

}
function area(poly) { let s = 0; for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length]; s += a.x * b.y - b.x * a.y; } return Math.abs(s / 2); }
function pointIn(p, poly) { let inside = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const a = poly[i], b = poly[j]; if ((a.y > p.y) !== (b.y > p.y) && p.x < ((b.x - a.x) * (p.y - a.y)) / (b.y - a.y) + a.x) inside = !inside; } return inside; }
/** The thinnest stroke in the ink, roughly: twice the largest inscribed radius's minimum over the ink's skeleton is costly, so sample: the smallest run length across ink in x and y, ignoring runs under 3 px. */
function strokeEstimate(mask, w, h) {
  let best = Infinity;
  const scan = (len, at) => { let run = 0; for (let i = 0; i <= len; i++) { if (i < len && at(i)) run++; else { if (run >= 3 && run < best) best = run; run = 0; } } };
  for (let y = 0; y < h; y += 2) scan(w, (x) => mask[y * w + x]);
  for (let x = 0; x < w; x += 2) scan(h, (y) => mask[y * w + x]);
  return best === Infinity ? 0 : best;
}

// ---- stats, views, resize ---------------------------------------------------
function stats(list) {
  document.getElementById('stats').innerHTML = list.map(([k, v]) => `<div class="stat"><b>${k}</b><span>${v}</span></div>`).join('');
}
function extent() { if (state.mode === 'square' && LAYOUTS) return LAYOUTS[state.i].outer; const [W] = state.size.split(',').map(Number); return W; }
function view(kind) {
  const d = extent();
  if (kind === 'top') camera.position.set(0, d * 1.9, 0.001);
  else camera.position.set(-d * 0.7, d * 1.0, d * 1.15);
  controls.target.set(0, 3, 0);
  controls.update();
}
function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(1, Math.floor(r.width)), h = Math.max(1, Math.floor(r.height));
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);
resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

function build() {
  const square = state.mode === 'square' && LAYOUTS && LAYOUTS.length;
  document.getElementById('nameCtl').hidden = !!square;
  document.getElementById('squareCtl').hidden = !square;
  document.getElementById('inkLabel').hidden = !square;
  for (const b of document.querySelectorAll('#modeSeg button')) b.setAttribute('aria-pressed', String(b.dataset.mode === (square ? 'square' : 'name')));
  for (const b of document.querySelectorAll('#sizeSeg button')) b.setAttribute('aria-pressed', String(b.dataset.size === state.size));
  for (const b of document.querySelectorAll('#ballSeg button')) b.setAttribute('aria-pressed', String(+b.dataset.ball === state.ballD));
  try { if (square) buildSquare(); else buildName(); }
  catch (e) { const w = document.getElementById('warn'); w.hidden = false; w.textContent = 'Could not build this one: ' + e.message; }
}

// ---- controls --------------------------------------------------------------
const on = (id, ev, fn) => document.getElementById(id).addEventListener(ev, fn);
for (const b of document.querySelectorAll('#modeSeg button')) b.addEventListener('click', () => { state.mode = b.dataset.mode; save(); build(); view('iso'); });
for (const b of document.querySelectorAll('#sizeSeg button')) b.addEventListener('click', () => { state.size = b.dataset.size; save(); build(); view('iso'); });
for (const b of document.querySelectorAll('#ballSeg button')) b.addEventListener('click', () => { state.ballD = +b.dataset.ball; save(); build(); });
const nameIn = document.getElementById('name');
nameIn.value = state.name;
nameIn.addEventListener('input', () => { state.name = nameIn.value.toUpperCase().slice(0, 10); save(); build(); });
on('shuffle', 'click', () => { state.seed = (state.seed + 1) | 0; save(); build(); });
const letterIn = document.getElementById('letter');
letterIn.value = state.letter;
letterIn.addEventListener('input', () => { state.letter = letterIn.value.toUpperCase().slice(0, 3) || ' '; save(); build(); });
for (const o of fontSel.options) if (o.value === state.font) fontSel.value = o.value;
fontSel.addEventListener('change', () => { const o = fontSel.selectedOptions[0]; state.font = o.value; state.weight = o.dataset.w; save(); build(); });
const flowSel = document.getElementById('flow');
flowSel.value = String(state.flow);
flowSel.addEventListener('change', () => { state.flow = +flowSel.value; save(); build(); });
on('next', 'click', () => { state.i = (state.i + 1) % LAYOUTS.length; save(); build(); });
on('prev', 'click', () => { state.i = (state.i - 1 + LAYOUTS.length) % LAYOUTS.length; save(); build(); });
function swatches(id, list, keyName) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  for (const c of list) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw'; b.style.background = c; b.setAttribute('aria-label', c); b.setAttribute('aria-pressed', String(state[keyName] === c));
    b.addEventListener('click', () => { state[keyName] = c; save(); swatches(id, list, keyName); build(); });
    el.appendChild(b);
  }
}
swatches('traySw', TRAYS, 'tray');
swatches('inkSw', INKS, 'ink');
for (const [id, k] of [['showLid', 'lid'], ['showBall', 'ball'], ['showPath', 'path'], ['hollow', 'hollow']]) {
  const cb = document.getElementById(id);
  cb.checked = !!state[k];
  cb.addEventListener('change', () => { state[k] = cb.checked; save(); build(); });
}
on('viewTop', 'click', () => view('top'));
on('viewIso', 'click', () => view('iso'));

build();
view('iso');
document.fonts?.ready?.then(() => build());
</script>
