<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3DiPad — Booth Operator</title>
    <style>
      :root { --bg:#0e1526; --panel:#16203a; --ink:#eaf0ff; --muted:#9fb0d6; --accent:#ffd23f; --ok:#34d399; --warn:#ff8a34; --danger:#ff6b6b; }
      * { box-sizing: border-box; }
      body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
      header { display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid #ffffff12; position:sticky; top:0; background:var(--bg); z-index:5; flex-wrap:wrap; }
      header h1 { font-size:20px; margin:0; }
      .pill { font-size:12px; padding:4px 10px; border-radius:20px; background:var(--panel); color:var(--muted); }
      .pill.on { color:#04371f; background:var(--ok); }
      .pill.off { color:#fff; background:#3a2330; }
      .stats { margin-left:auto; display:flex; gap:8px; font-size:13px; color:var(--muted); }
      main { padding:18px; display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
      .card { background:var(--panel); border-radius:16px; padding:14px; border:1px solid #ffffff10; }
      .card.st-colour_change { border-color:var(--warn); box-shadow:0 0 0 2px #ff8a3455; }
      .card.st-ready { border-color:var(--ok); }
      .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
      .who { font-weight:700; font-size:17px; }
      .seq { color:var(--muted); font-size:13px; }
      .status { font-size:12px; text-transform:uppercase; letter-spacing:.5px; padding:3px 8px; border-radius:6px; background:#26324f; color:var(--muted); }
      .status.printing { background:#1d3a5f; color:#7db9ff; }
      .status.colour_change { background:var(--warn); color:#241203; }
      .status.ready { background:var(--ok); color:#04371f; }
      .status.queued { background:#2a2f45; color:#c7cbe0; }
      .colours { display:flex; gap:8px; align-items:center; margin:10px 0; font-size:13px; }
      .chip { display:inline-flex; align-items:center; gap:6px; background:#0e1730; padding:5px 10px; border-radius:8px; }
      .dot { width:16px; height:16px; border-radius:4px; border:1px solid #ffffff30; }
      .arrow { color:var(--muted); }
      .prev { width:100%; background:#fff; border-radius:8px; margin:8px 0; }
      .meta { font-size:12px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
      .actions { display:flex; flex-wrap:wrap; gap:8px; }
      button { font:inherit; font-weight:600; font-size:14px; border:none; border-radius:9px; padding:9px 12px; cursor:pointer; background:#2b3a63; color:var(--ink); }
      button.primary { background:var(--accent); color:#22252b; }
      button.ok { background:var(--ok); color:#04371f; }
      button.warn { background:var(--warn); color:#241203; }
      button.ghost { background:#20294a; color:var(--muted); }
      a.dl { font-size:12px; color:#7db9ff; text-decoration:none; }
      .empty { color:var(--muted); padding:60px 20px; text-align:center; grid-column:1/-1; }

      /* history: same cards, dimmed, with when they were made */
      .pill.tab { border:0; font:inherit; cursor:pointer; }
      .pill.tab.on { background:var(--accent); color:#22252b; font-weight:700; }
      .histbar { padding:12px 18px 0; color:var(--muted); font-size:13px; }
      .card.past { opacity:.82; }
      .card.past:hover { opacity:1; }
      .when { color:var(--muted); }
      .swap-banner { background:var(--warn); color:#241203; font-weight:700; padding:8px; border-radius:8px; text-align:center; margin-bottom:8px; font-size:13px; }
      select { font:inherit; padding:8px; border-radius:8px; background:#20294a; color:var(--ink); border:1px solid #ffffff20; }
      /* Printer status, readable from across the booth: one big square each,
         green free / red busy / amber wants you. */
      .printers { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
                  gap:14px; padding:14px 18px 0; max-width:1000px; }
      .ptile { border-radius:16px; padding:14px 16px; color:#0b1220; display:flex; flex-direction:column; gap:2px;
               border:2px solid #ffffff20; }
      .ptile .nm { font-weight:800; font-size:17px; letter-spacing:-.01em; }
      .ptile .st { font-weight:800; font-size:25px; line-height:1.15; letter-spacing:-.02em; }
      .ptile .sub { font-size:13px; font-weight:600; opacity:.75; min-height:17px; }
      .ptile.free { background:var(--ok); }
      .ptile.busy { background:var(--danger); }
      .ptile.soon { background:var(--warn); }
      .ptile.dead { background:#243050; color:var(--muted); border-color:#ffffff10; }
      /* The swap pause is the one thing that stops the whole booth until someone
         walks over, so it moves as well as being amber. */
      .ptile.swap { animation:pulse 1s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 #ff8a3400; } 50% { box-shadow:0 0 0 7px #ff8a3455; } }
      @media (prefers-reduced-motion: reduce) { .ptile.swap { animation:none; border-color:#241203; } }
      .ptile .bar { width:100%; height:6px; background:#00000030; border-radius:4px; overflow:hidden; margin-top:5px; }
      .ptile .bar i { display:block; height:100%; background:#00000055; }
      /* Which two filaments this job needs. The file name says it in words;
         across a noisy booth the operator reads the squares, not the words. */
      .ptile .cols { display:flex; align-items:center; gap:7px; margin-top:7px; font-size:12px; font-weight:700; }
      .ptile .cols .arrow { color:#0b122099; font-weight:800; }
      .ptile.dead .cols .arrow { color:var(--muted); }
      .swatch { width:26px; height:26px; border-radius:7px; flex:none;
                border:2px solid #0b122055; box-shadow:0 0 0 1px #ffffff99 inset; }
      .swatch.big { width:30px; height:30px; }
      /* The one still to be loaded, during a swap pause. */
      .swatch.next { box-shadow:0 0 0 1px #ffffff99 inset, 0 0 0 4px #241203; }

      /* One button per printer, so a job is never sent to a machine whose
         filament the operator has not checked. */
      .sendrow { display:flex; gap:7px; flex-wrap:wrap; width:100%; margin-bottom:8px; }
      .pbtn { background:#2b3a63; color:var(--ink); border:2px solid transparent; font-weight:700; }
      .pbtn.can { background:var(--ok); color:#04371f; }
      /* set up, but not telling us anything — sending works, starting might not */
      .pbtn.blind { background:var(--warn); color:#241203; }
      .pbtn.on { border-color:var(--accent); }
      .pbtn[disabled] { background:#1b2440; color:#5d6a8c; cursor:not-allowed; }
    </style>
  </head>
  <body>
    <header>
      <h1>🖨️ 3DiPad Booth</h1>
      <span class="pill" id="p-drive">Drive</span>
      <span class="pill" id="p-notify">Notify</span>
      <span class="pill" id="p-lan">LAN</span>
      <span class="pill" id="p-outbox" style="display:none"></span>
      <a class="pill" href="setup.html" style="text-decoration:none">🔌 Printer setup</a>
      <button class="pill tab" id="tab-toggle" onclick="toggleView()">🕘 History</button>
      <div class="stats" id="stats"></div>
    </header>
    <div class="printers" id="printer-strip"></div>
    <div class="histbar" id="histbar" style="display:none"></div>
    <main id="board"><div class="empty">Loading…</div></main>

    <script>
      const COLOUR_HEX = { BLACK:'#1c1c1e',WHITE:'#f5f5f7',RED:'#e23b3b',BLUE:'#2f6fed',GREEN:'#34a853',YELLOW:'#f4c20d',PINK:'#ff5fa2',PURPLE:'#8b5cf6',ORANGE:'#ff8a34',TEAL:'#14b8a6',GREY:'#8e8e93',GRAY:'#8e8e93',GOLD:'#d4af37',SILVER:'#c0c4cc',BROWN:'#8b5a2b' };
      let printers = [];
      // the cards need every job's printer assignment, not just their own
      let allJobs = [];

      // The operator view polls constantly; history is a separate, heavier fetch
      // asked for on demand, so a full day's jobs are not shipped every 2s.
      let showingHistory = false;

      async function tick() {
        try {
          const r = await fetch('/api/jobs');
          const d = await r.json();
          printers = d.printers || [];
          render(d);
          if (showingHistory) await renderHistory();
        } catch { document.getElementById('board').innerHTML = '<div class="empty">No connection to booth server…</div>'; }
      }

      function toggleView() {
        showingHistory = !showingHistory;
        const btn = document.getElementById('tab-toggle');
        btn.classList.toggle('on', showingHistory);
        btn.textContent = showingHistory ? '← Back to active' : '🕘 History';
        document.getElementById('histbar').style.display = showingHistory ? '' : 'none';
        tick();
      }

      async function renderHistory() {
        const d = await (await fetch('/api/history?limit=300')).json();
        document.getElementById('histbar').textContent =
          `${d.jobs.length} of ${d.total} jobs, newest first. Press a printer to run one again — the file is still on disk.`;
        const board = document.getElementById('board');
        if (!d.jobs.length) { board.innerHTML = '<div class="empty">Nothing has been submitted yet.</div>'; return; }
        board.innerHTML = d.jobs.map((j) => card(j, true)).join('');
      }

      function render(d) {
        const drive = document.getElementById('p-drive');
        const notifyEl = document.getElementById('p-notify');
        const outbox = document.getElementById('p-outbox');
        drive.className = 'pill ' + (d.integrations.drive ? 'on' : 'off');
        drive.textContent = 'Drive ' + (d.integrations.drive ? 'on' : 'off');
        const prov = d.integrations.notify || 'none';
        notifyEl.className = 'pill ' + (prov === 'none' ? 'off' : 'on');
        notifyEl.textContent = 'Notify: ' + (prov === 'ghl' ? 'GoHighLevel' : prov === 'meta' ? 'WhatsApp' : 'off');
        const lanEl = document.getElementById('p-lan');
        lanEl.className = 'pill ' + (d.integrations.lan ? 'on' : 'off');
        lanEl.textContent = 'LAN ' + (d.integrations.lan ? 'auto-send' : 'off');
        const pend = d.integrations.outbox?.pending || 0;
        outbox.style.display = pend ? '' : 'none';
        outbox.className = 'pill off';
        outbox.textContent = '⏳ ' + pend + ' queued (retrying)';
        allJobs = d.jobs || [];
        renderPrinters(d.printers || [], allJobs);
        const s = d.stats.by;
        document.getElementById('stats').innerHTML =
          `<span>Leads: <b>${d.stats.leads}</b></span><span>Queued: ${s.queued||0}</span><span>Printing: ${s.printing||0}</span><span>Ready: ${s.ready||0}</span>`;

        if (showingHistory) return; // the history fetch owns the board
        const board = document.getElementById('board');
        if (!d.jobs.length) { board.innerHTML = '<div class="empty">No active jobs. Waiting for the next little artist ✏️</div>'; return; }
        board.innerHTML = d.jobs.map((j) => card(j)).join('');
      }

      /**
       * What a printer is doing, in the terms the booth cares about:
       *   free  — send it a job
       *   busy  — do not
       *   soon  — about to be free, or waiting on you
       *   dead  — not set up, or not answering
       * `jobs` matters as well as the printer's own report: a job assigned
       * seconds ago is on that printer before the printer has said so.
       */
      function printerState(p, jobs) {
        if (!p.configured) return { cls: 'dead', st: 'NOT SET UP', sub: 'Add it on the setup page' };
        const live = p.live || {};
        const state = String(live.state || '').toUpperCase();
        if (!state) return { cls: 'dead', st: 'NO SIGNAL', sub: 'Check it on the setup page' };

        const holding = jobs.find((j) => j.printerId === p.id && ['assigned', 'printing', 'colour_change'].includes(j.status));
        const who = holding ? holding.name : '';
        const mins = typeof live.remainingMin === 'number' ? live.remainingMin : null;
        const pct = typeof live.percent === 'number' ? live.percent : null;
        // The two filaments this machine is committed to while it holds a job.
        const cols = holding ? holding.colours : null;

        if (state === 'PAUSE') {
          return { cls: 'soon swap', st: 'SWAP NOW', sub: holding ? `Load ${holding.colours.layer2} for ${who}` : 'Waiting for a filament change', pct, cols, next: 2 };
        }
        if (state === 'FAILED') return { cls: 'busy', st: 'FAILED', sub: who, pct, cols };
        // Heating is not printing. The printer reports PREPARE while it brings
        // the bed and nozzle up, and during that its remaining-time estimate is
        // 0 — which the "1 minute or less" rule read as ALMOST DONE, on a print
        // that had not laid a single line. Give the wait its own state and only
        // trust the estimate once the print is genuinely under way.
        if (state === 'PREPARE' || state === 'SLICING') {
          return { cls: 'busy', st: 'HEATING UP', sub: [who, 'bed and nozzle'].filter(Boolean).join(' · '), pct: 0, cols, next: 1 };
        }
        if (state === 'RUNNING') {
          const started = (pct ?? 0) > 0;
          if (!started) return { cls: 'busy', st: 'STARTING', sub: [who, 'first layer'].filter(Boolean).join(' · '), pct: 0, cols };
          const soon = mins != null && mins <= 1;
          return {
            cls: soon ? 'soon' : 'busy',
            st: soon ? 'ALMOST DONE' : 'PRINTING',
            sub: [who, mins != null ? `${mins} min left` : null].filter(Boolean).join(' · '),
            pct, cols,
          };
        }
        // idle by its own account, but a job was just handed to it. The
        // operator has to load colour 1 before it starts, so show it early.
        if (holding) return { cls: 'busy', st: 'STARTING', sub: who, pct, cols, next: 1 };
        return { cls: 'free', st: 'READY', sub: 'Free for the next job' };
      }

      function renderPrinters(list, jobs) {
        const strip = document.getElementById('printer-strip');
        if (!list.length) { strip.innerHTML = ''; return; }
        strip.innerHTML = list.map((p) => {
          const s = printerState(p, jobs);
          return `<div class="ptile ${s.cls}">
            <span class="nm">${esc(p.name)}</span>
            <span class="st">${esc(s.st)}</span>
            <span class="sub">${esc(s.sub || '')}</span>
            ${filaments(s.cols, s.next)}
            ${s.pct != null ? `<span class="bar"><i style="width:${s.pct}%"></i></span>` : ''}
          </div>`;
        }).join('');
      }

      /** Backing colour → design colour, as squares. `next` rings the one the
       *  operator still has to put in the machine. */
      function filaments(cols, next) {
        if (!cols) return '';
        return `<span class="cols">
          ${swatch(cols.layer1, next === 1)}${esc(cols.layer1)}
          <span class="arrow">→</span>
          ${swatch(cols.layer2, next === 2)}${esc(cols.layer2)}
        </span>`;
      }
      function swatch(name, ring) {
        return `<span class="swatch${ring ? ' big next' : ''}" title="${esc(name)}"
                      style="background:${COLOUR_HEX[String(name).toUpperCase()]||'#888'}"></span>`;
      }
      function dot(name) { return `<span class="dot" style="background:${COLOUR_HEX[name]||'#888'}"></span>`; }
      function card(j, past = false) {
        const pName = (printers.find(p=>p.id===j.printerId)||{}).name || '';
        const when = past && j.createdAt
          ? `<span class="when">${new Date(j.createdAt).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' })}</span>` : '';
        const swap = j.status === 'colour_change'
          ? `<div class="swap-banner">⚠️ SWAP NOW → load ${j.colours.layer2}, then Resume on the printer</div>` : '';
        const notify = j.notify ? (j.notify.ok ? '✅ sent' : (j.notify.queued ? '⏳ retrying' : '⚠️ '+(j.notify.error||j.notify.skipped||'failed'))) : '';
        const lead = j.leadPush ? (j.leadPush.ok ? '· CRM ✓' : (j.leadPush.queued ? '· CRM ⏳' : '')) : '';
        return `<div class="card st-${j.status}${past ? ' past' : ''}">
          ${swap}
          <div class="top">
            <div><div class="who">${esc(j.name)}</div><div class="seq">#${String(j.seq).padStart(4,'0')} · ${j.phone} ${when}</div></div>
            <span class="status ${j.status}">${j.status.replace('_',' ')}</span>
          </div>
          <div class="colours">
            <span class="chip">${dot(j.colours.layer1)} ${j.colours.layer1}</span>
            <span class="arrow">→</span>
            <span class="chip">${dot(j.colours.layer2)} ${j.colours.layer2}</span>
          </div>
          <img class="prev" src="${j.previewUrl}" alt="design" onerror="this.style.display='none'"/>
          <div class="meta">
            <span>Hole: ${j.hole}</span><span>~${j.est} min</span>${pName?`<span>${pName}</span>`:''}
            <a class="dl" href="${j.gcodeUrl}" download>⬇ ${j.filename}</a>
            ${j.driveLink?`<a class="dl" href="${j.driveLink}" target="_blank">Drive</a>`:''}
            ${notify?`<span>${notify}</span>`:''}${lead?`<span>${lead}</span>`:''}
          </div>
          ${actions(j)}
        </div>`;
      }

      function actions(j) {
        // One button per printer, never "any free printer": the operator has to
        // know which machine is loaded with which colour before a job goes to
        // it, and a dropdown hides that decision behind a second tap.
        const send = printers.map((p) => {
          const s = printerState(p, allJobs);
          const free = s.cls === 'free';
          // A printer that is set up but silent used to be unpressable, which
          // left a whole machine unusable for the day over a status feed. The
          // file still uploads to its SD card over a different connection, so
          // the send is offered — flagged, because the printer may need Print
          // pressing on its own screen.
          const blind = !free && s.cls === 'dead' && p.configured;
          const mine = p.id === j.printerId;
          const why = s.cls === 'dead' ? s.st.toLowerCase() : `${s.st.toLowerCase()}${s.sub ? ' — ' + s.sub : ''}`;
          const title = free ? `Send ${j.colours.layer1} → ${j.colours.layer2} to ${p.name}`
            : blind ? `${p.name} is not reporting its status. The file will still be copied to its SD card — you may have to press Print on the printer itself.`
            : `${p.name} is ${why}`;
          return `<button class="pbtn ${free ? 'can' : ''} ${blind ? 'blind' : ''} ${mine ? 'on' : ''}" ${free || blind ? '' : 'disabled'}
            title="${esc(title)}"
            onclick="sendTo('${j.id}','${p.id}')">${esc(p.name)}${blind ? ' ⚠' : ''}</button>`;
        }).join('');
        const assign = printers.length ? `<div class="sendrow">${send}</div>` : '';

        const btns = [];
        if (j.status !== 'printing') btns.push(`<button class="primary" onclick="setStatus('${j.id}','printing')">Printing</button>`);
        btns.push(`<button class="warn" onclick="setStatus('${j.id}','colour_change')">Colour swap</button>`);
        if (j.status !== 'ready') btns.push(`<button class="ok" onclick="setStatus('${j.id}','ready')">Ready → WhatsApp</button>`);
        else btns.push(`<button class="ghost" onclick="notify('${j.id}')">Resend WA</button>`);
        btns.push(`<button class="ghost" onclick="setStatus('${j.id}','collected')">Collected</button>`);
        return `<div class="actions">${assign}${btns.join('')}</div>`;
      }

      async function sendTo(id, printerId) {
        const r = await (await fetch(`/api/jobs/${id}/dispatch`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(printerId ? { printerId } : {}),
        })).json();
        if (!r.ok) alert('Could not send: ' + (r.error || r.result?.error || 'unknown'));
        tick();
      }

      async function setStatus(id, status, printerId) {
        await fetch(`/api/jobs/${id}/status`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ status, printerId }) });
        tick();
      }
      async function notify(id) {
        const r = await (await fetch(`/api/jobs/${id}/notify`, { method:'POST' })).json();
        alert(r.ok ? 'WhatsApp sent' : 'Failed: ' + (r.notify?.error || 'unknown'));
        tick();
      }
      const esc = (s) => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

      tick();
      setInterval(tick, 4000);
    </script>
  </body>
</html>
